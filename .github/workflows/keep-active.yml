name: Keep Supabase Active

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured Supabase endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in repository secrets."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --output /dev/null
          echo "Supabase REST endpoint responded successfully."
