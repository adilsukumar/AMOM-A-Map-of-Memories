<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="t d"><title id="t">Somewhere on Earth, something mattered. Just someone who remembered something. A Map Of Memories by Adil Sukumar.</title><desc id="d">Somewhere on Earth, something mattered. Just someone who remembered something. A Map Of Memories by Adil Sukumar. Conceptual memory-map illustration, not real locations, user stories or an app screenshot.</desc><style>@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.pin{animation:pin 8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pin,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="54" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="600" >A MAP OF MEMORIES / ADIL SUKUMAR</text><text x="30" y="161" font-family="Bahnschrift, Arial, sans-serif" font-size="70" fill="#F8F8F3" font-weight="700" >Somewhere on Earth,</text><text x="30" y="238" font-family="Bahnschrift, Arial, sans-serif" font-size="72" fill="#BCFCF6" font-weight="700" >something mattered.</text><text x="32" y="312" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >Just someone who remembered something.</text><g transform="translate(790 365) scale(0.66)"><rect x="0" y="0" width="330" height="300" rx="18" fill="#141320" stroke="#343044"/><path d="M0 70C70 90 95 15 170 60S270 130 330 85" fill="none" stroke="#343044" stroke-width="3" stroke-linecap="round" stroke-l