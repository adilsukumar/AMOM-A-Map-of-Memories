<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="t d"><title id="t">FIND THE PLACE. Search for a location or navigate to somewhere meaningful.; PLACE THE MEMORY. Sign in and choose a point on the map for your story.; MAKE IT YOURS. Add a title, description, category, color and optional photo.; SAVE &amp; REVISIT. Create the memory, then find it again on the map or in the panel.</title><desc id="d">FIND THE PLACE. Search for a location or navigate to somewhere meaningful.; PLACE THE MEMORY. Sign in and choose a point on the map for your story.; MAKE IT YOURS. Add a title, description, category, color and optional photo.; SAVE &amp; REVISIT. Create the memory, then find it again on the map or in the panel. Conceptual memory-map illustration, not real locations, user stories or an app screenshot.</desc><style>@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.pin{animation:pin 8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pin,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M3 9l13-5 12 5 13-5v31l-13 5-12-5-13 5zM16 4v31M28 9v31" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >FIND THE PLACE</text><text x