<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="t d"><title id="t">CLUSTERS WITH CONTEXT. Marker clusters vary their size and intensity with the number of memories.; MULTIPLE MAP LAYERS. Switch between configured street, satellite and other tile views.; MEMORY MANAGEMENT. Use memory cards and the list panel to revisit, edit or delete records.</title><desc id="d">CLUSTERS WITH CONTEXT. Marker clusters vary their size and intensity with the number of memories.; MULTIPLE MAP LAYERS. Switch between configured street, satellite and other tile views.; MEMORY MANAGEMENT. Use memory cards and the list panel to revisit, edit or delete records. Conceptual memory-map illustration, not real locations, user stories or an app screenshot.</desc><style>@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.pin{animation:pin 8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pin,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M22 42S6 26 6 16a16 16 0 1 1 32 0C38 26 22 42 22 42M22 9a7 7 0 1 0 0 14a7 7 0 1 0 0-14" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >CLUSTERS WITH CONTEXT</text><text x="48" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Marker clusters vary their size</text><text x="48" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >and intensity with the number of</text><text x="48" y="190" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >memories.</text><rect x="574" y="12" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(596 34) scale(0.9090909090909091)"><path d="M3 9l13-5 12 5 13-5v31l-13 5-12-5-13 5zM16 4v31M28 9v31" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="654" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >MULTIPLE MAP LAYERS</text><text x="598" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Switch between configured street,</text><text x="598" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >satellite and other tile views.</text><rect x="24" y="287" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 309) scale(0.9090909090909091)"><path d="M5 5h34v29H18L7 42v-8H5zM12 14h20M12 23h15" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="338" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >MEMORY MANAGEMENT</text><text x="48" y="397" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Use memory cards and the list</text><text x="48" y="431" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >panel to revisit, edit or delete</text><text x="48" y="465" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFC