<svg xmlns="http://www.w3.org/2000/svg" width="520" height="145" viewBox="0 0 520 145" role="img" aria-labelledby="t d"><title id="t">Memory workflow. Fetch, create, edit and delete records</title><desc id="d">Memory workflow. Fetch, create, edit and delete records Conceptual memory-map illustration, not real locations, user stories or an app screenshot.</desc><style>@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.pin{animation:pin 8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pin,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="140" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(22 25) scale(0.9545454545454546)"><path d="M5 5h34v29H18L7 42v-8H5zM12 14h20M12 23h15" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="82" y="53" font-family="Bahnschrift, Arial, sans-serif" font-size="28" fill="#F3D962" font-weight="600" >Memory workflow</text><text x="22" y="112" font-family="Bahnschrift, Arial, sans-serif" font-size="21" fill="#BCFCF6" font-weight="400" >Fetch, create, edit and delete records</text></svg>